[project]
name = "smart_home"
version = "0.1.0"
description = "Personal smart home system"
authors = [
    {name = "ivangor246",email = "ivangor246@gmail.com"}
]

requires-python = ">=3.14"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [
    { include = "app", from = "src" }
]

[tool.poetry.dependencies]
fastapi = "^0.136.3"
uvicorn = "^0.49.0"
websockets = "^16.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.15.0"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["C", "E", "F", "W"]

[tool.ruff.format]
quote-style = "single"